{% extends 'base.html' %}
{% block content %}
<div class="container-fluid flex-grow-1 d-flex p-0">
    <!-- Sidebar -->
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse shadow-sm border-end min-vh-100">
        <div class="position-sticky pt-4">
            <div class="text-center mb-4 text-white">
                <i class="bi bi-person-circle display-4 text-primary"></i>
                <h5 class="mt-2">{{ current_user.username }}</h5>
                <span class="badge bg-success">Admin</span>
            </div>
            <hr class="text-white-50">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link py-3 {% if request.endpoint == 'admin.dashboard' %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('admin.dashboard') }}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'students' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('students.list_students') }}">
                        <i class="bi bi-people-fill me-2"></i> Students
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'admissions' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('admissions.list_admissions') }}">
                        <i class="bi bi-file-earmark-text-fill me-2"></i> Admissions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'courses' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('admin.courses') }}">
                        <i class="bi bi-book-half me-2"></i> Courses
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'attendance' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('attendance.list_attendance') }}">
                        <i class="bi bi-calendar-check-fill me-2"></i> Attendance
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'fees' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('fees.list_fees') }}">
                        <i class="bi bi-cash-coin me-2"></i> Fees
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-3 {% if 'notices' in request.endpoint %}active text-white bg-primary fw-bold{% else %}text-white-50 hover-text-white{% endif %}" href="{{ url_for('notices.list_notices') }}">
                        <i class="bi bi-megaphone-fill me-2"></i> Notices
                    </a>
                </li>
            </ul>
            <hr class="text-white-50">
            <ul class="nav flex-column mb-2">
                <li class="nav-item">
                    <a class="nav-link py-3 text-danger" href="{{ url_for('auth.logout') }}">
                        <i class="bi bi-box-arrow-right me-2"></i> Sign out
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 bg-light w-100">
        {% block admin_content %}{% endblock %}
    </main>
</div>
<style>
    .hover-text-white:hover { color: white !important; }
</style>
{% endblock %}
